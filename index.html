<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Choir Practice</title>
<meta name="description" content="Practice tracks for the Northland Community Choir.">
<meta name="theme-color" content="#1f5c45">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
:root{
  --bg:#f6f4ef; --surface:#ffffff; --ink:#1b1f1d; --muted:#555f5a; --line:#d8ddd9;
  --accent:#1f5c45; --accent-soft:#e2efe8; --rec:#6a3f8f; --rec-soft:#efe7f6; --on:#ffffff; --warn:#8a3b12;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-head:"Fraunces", Georgia, serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111513; --surface:#1a201d; --ink:#eef2ef; --muted:#a7b3ad; --line:#2d3732;
  --accent:#7fd3a8; --accent-soft:#1d3329; --rec:#c9a6ec; --rec-soft:#2b2236; --on:#111513; --warn:#f2a679 } }
:root[data-theme="dark"]{
  --bg:#111513; --surface:#1a201d; --ink:#eef2ef; --muted:#a7b3ad; --line:#2d3732;
  --accent:#7fd3a8; --accent-soft:#1d3329; --rec:#c9a6ec; --rec-soft:#2b2236; --on:#111513; --warn:#f2a679 }
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 var(--f-body);
  padding:0 max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
main{max-width:600px;margin:16px auto 0;display:flex;flex-direction:column;gap:16px}
h1{font:600 1.55rem/1.15 var(--f-head);margin:2px 0 0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.eyebrow{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sub{color:var(--muted);font-size:.95rem}
.msg{border-left:4px solid var(--warn);padding:8px 12px;background:var(--surface);border-radius:8px;font-size:.95rem}
.c-part{--c:var(--accent);--cs:var(--accent-soft);--o:var(--rec);--os:var(--rec-soft)}
.c-rec{--c:var(--rec);--cs:var(--rec-soft);--o:var(--accent);--os:var(--accent-soft)}
select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;min-height:40px}

/* One switch: Full choir | <your part> ▾ */
.switch{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.seg{border:0;border-radius:12px;background:transparent;min-height:50px;padding:8px 10px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg[aria-pressed="true"]{background:var(--c);color:var(--on)}
.seg .car{flex:none;opacity:.75;margin-top:1px}
.seg.ask{color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}

/* Bottom sheet for choosing a part */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:600px;border-radius:20px 20px 0 0;background:var(--surface);color:var(--ink)}
dialog.sheet::backdrop{background:rgba(0,0,0,.45)}
.sheet .hd{padding:18px 20px 6px;font-weight:700}
.sheet .opts{display:flex;flex-direction:column;padding:0 8px max(12px,env(safe-area-inset-bottom))}
.sheet .opt{border:0;background:none;text-align:left;padding:14px 12px;border-radius:12px;font-weight:700;display:flex;justify-content:space-between;min-height:52px}
.sheet .opt[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}

/* Playlist */
.pl{list-style:none;margin:0;padding:0}
.pl>li{border-radius:0}
.pl>li.cur{border-radius:16px}
.pl>li+li{border-top:1px solid var(--line)}
.pl>li.cur{background:var(--cs);border-top-color:transparent}
.pl>li.cur+li{border-top-color:transparent}
.pr{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:12px 8px;min-height:68px}
.pr .n{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;font-weight:700;color:var(--muted);font-size:.95rem}
.pr .nm{min-width:0}
.pr .nm b{display:block;font-size:1.05rem;line-height:1.25}
.pr .nm span{display:block;color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .du{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.pl li.cur .n{background:var(--c);color:var(--on)}
.pl li.cur .nm b{color:var(--c)}
.prog{height:3px;margin:0 12px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--c)}

/* The open piece */
.open{padding:6px 8px 12px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.9rem;min-height:40px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--on)}
.chip select{border:0;padding:0 2px;min-height:0;background:transparent;font-weight:700;font-size:inherit}
.secs{display:flex;flex-direction:column;background:var(--surface);border-radius:14px;padding:4px}
.secr{display:grid;grid-template-columns:1fr 48px;align-items:center;border-radius:10px}
.secr+.secr{box-shadow:0 -1px 0 var(--line)}
.sec{display:grid;grid-template-columns:3.6em 1fr auto;gap:10px;align-items:baseline;text-align:left;border:0;background:none;padding:11px 4px 11px 10px;border-radius:10px;width:100%;min-height:48px}
.rp{width:44px;height:44px;border:0;border-radius:999px;background:none;color:var(--muted);display:grid;place-items:center;justify-self:center}
.rp[aria-pressed="true"]{background:var(--c);color:var(--on)}
.rp:disabled{opacity:.25}
.secr.on{background:var(--cs);box-shadow:inset 4px 0 0 var(--c)}
.secr.on .sec .d,.secr.on .sec .m{font-weight:700;color:var(--ink)}
.sec .m{font-size:.85rem;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.sec .d{min-width:0}
.sec .tm{font-variant-numeric:tabular-nums;color:var(--c);font-weight:700;font-size:.9rem}
.sec .pg{font-size:.8rem;color:var(--muted);margin-left:8px;text-decoration:underline}
.sec:disabled{opacity:1;color:var(--muted)}
.sec:disabled .tm{color:var(--muted);font-weight:400;font-size:.8rem}

/* Offline: one quiet row */
.offl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 8px;border-top:1px solid var(--line);font-size:.95rem}
.offl button{border:0;background:none;padding:6px 0;font-weight:700;color:var(--accent);text-align:left}
.offl .x{color:var(--muted);font-weight:400;text-decoration:underline}
.offl progress{width:100%;height:6px}

/* Pinned player */
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  margin:0 calc(-1 * max(16px,env(safe-area-inset-right))) 0 calc(-1 * max(16px,env(safe-area-inset-left)));
  padding:max(8px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left))}
.bar>div{max-width:600px;margin:0 auto}
.bar .top{display:flex;align-items:flex-start;gap:10px}
.bar .what{flex:1;min-width:0;text-align:left;background:none;border:0;padding:2px 0}
.bar .what:disabled{opacity:1}
.bar .what b{font-size:1rem;margin-right:6px}
.bar .what b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .trk{color:var(--muted);font-weight:400}
.bar .secl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:700;color:var(--c);font-size:.92rem;line-height:1.3;margin-top:2px}
.bar .sw{flex:none;max-width:42%;min-height:40px;border-radius:999px;border:1px solid var(--o);background:var(--os);color:var(--o);font-weight:700;font-size:.85rem;padding:0 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .seek{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-top:4px;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar .seek input{width:100%;height:28px;margin:0;accent-color:var(--c)}
.bar .ctl{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:2px}
.bar .ib{width:60px;min-height:52px;border-radius:14px;border:0;background:transparent;font-weight:700;font-size:1.15rem;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 0;line-height:1}
.bar .ib small{font-size:.68rem;font-weight:700;color:var(--muted);letter-spacing:.01em}
.bar .ib[aria-pressed="true"]{background:var(--c);color:var(--on)}
.bar .ib[aria-pressed="true"] small{color:var(--on)}
.bar .play{width:56px;height:56px;border-radius:999px;border:0;background:var(--c);color:var(--on);font-size:1.3rem;flex:none}
@media (max-width:360px){.bar .ctl{gap:0}.bar .ib{width:54px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.bar .dl{flex:none;width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.8rem;color:var(--muted)}
.bar .dl.done{color:var(--accent);border-color:var(--accent)}
.sheet .body{padding:4px 20px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sheet progress{width:100%;height:8px}
.sheet .acts{display:flex;flex-wrap:wrap;gap:8px}
.sheet .acts .opt{flex:1 1 auto;justify-content:center;border:1px solid var(--line)}
.sheet .acts .go{background:var(--accent);border-color:var(--accent);color:var(--on)}
.sheet .acts .quiet{border:0;color:var(--muted);text-decoration:underline;font-weight:400;flex-basis:100%}
</style>
</head>
<body>
<div class="bar c-part" id="bar" role="region" aria-label="Now playing" hidden></div>
<main id="app"><p>Loading…</p></main>
<script src="config.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  const KEY = window.CHOIR_KEY || "";
  const API = window.CHOIR_API || "https://www.googleapis.com/drive/v3/files/";
  const src = id => `${API}${encodeURIComponent(id)}?alt=media&key=${encodeURIComponent(KEY)}`;
  const AUDIO = "ncc-audio-v1", audioKey = id => "https://ncc-audio.local/" + id;
  const canSave = "serviceWorker" in navigator && "caches" in window;
  const BACK = 5;   // seconds the Back button jumps: about two bars, enough to catch the start of a phrase
  const ICON = {
    dl: `<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:auto"><path d="M12 3.5v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>`,
    back: `<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5a7.5 7.5 0 1 1-7.5 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M14.5 2 12 4.5 14.5 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="12" y="15.6" text-anchor="middle" font-size="9" font-weight="700" fill="currentColor" font-family="system-ui,sans-serif">${BACK}</text></svg>`,
    repeat: `<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg>`,
  };
  let saved = new Set(), saving = null, saveMsg = "";

  let P = null, part = store.get("ncc-part") || null, pi = -1, mode = "part", fi = 0, loop = null, speed = 1, err = "";
  const audio = new Audio(); audio.preload = "metadata";

  function fmt(t) { if (t == null || !isFinite(t)) return "–:––"; t = Math.max(0, t); const m = Math.floor(t / 60), s = Math.floor(t % 60); return m + ":" + (s < 10 ? "0" : "") + s; }
  const piece = () => P.pieces[pi];

  /* ----- tracks: a list of files (one, or one per movement) ----- */
  // A second line for the same part in a piece (e.g. Tenor 1 and Tenor 2 both in the Tenor folder).
  const altOf = pc => (pc.alt && part && pc.alt[part] && pc.alt[part][0]) || null;
  const mainVoice = pc => (pc.mainVoice && pc.mainVoice[part]) || part;
  function partTrackName(pc) { return pc.tracks[part] ? part : (pc.tracks["Balanced Voices"] ? "Balanced Voices" : Object.keys(pc.tracks)[0]); }
  function track(pc, m) {
    if (m === "rec") return pc.recording ? [{ id: pc.recording.id, mvt: 0, offset: 0 }] : [];
    if (m === "part2") { const a = altOf(pc); return a ? a.files : []; }
    return pc.tracks[partTrackName(pc)] || [];
  }
  function modes(pc) {
    const a = altOf(pc);
    const out = [{ m: "part", label: part && pc.tracks[part] ? (a ? mainVoice(pc) : part) : "Practice track" }];
    if (a) out.push({ m: "part2", label: a.label });
    if (pc.recording) out.unshift({ m: "rec", label: "Full choir" });
    return out;
  }
  // Where section `s` starts on track mode `m`: {f: file index, t: seconds} or null.
  function startOf(pc, s, m) {
    if (m === "rec") return s.rec != null ? { f: 0, t: s.rec } : null;
    if (s.part == null) return null;
    const files = track(pc, m), f = files.findIndex(x => x.mvt === (s.mvt || 0));
    if (f < 0) return null;
    return { f, t: Math.max(0, s.part + (files[f].offset || 0)) };
  }
  function sectionAt(pc, m, f, t) {
    let best = null, bt = -1;
    pc.sections.forEach(s => { const st = startOf(pc, s, m); if (st && st.f === f && st.t <= t + 0.05 && st.t >= bt) { best = s; bt = st.t; } });
    return best;
  }
  function sectionEnd(pc, m, s) {
    const a = startOf(pc, s, m); let end = null;
    pc.sections.forEach(x => { const st = startOf(pc, x, m); if (x !== s && st && st.f === a.f && st.t > a.t + 0.05 && (end == null || st.t < end)) end = st.t; });
    return { f: a.f, a: a.t, b: end };
  }

  /* ----- playback ----- */
  function load(f, at, play) {
    const files = track(piece(), mode); if (!files[f]) return;
    const id = files[f].id;
    fi = f; err = "";
    if (audio.dataset.id !== id) { audio.dataset.id = id; audio.src = src(id); }
    audio.playbackRate = speed;
    const go = () => { if (at != null) audio.currentTime = at; if (play) audio.play().catch(() => {}); };
    if (audio.readyState >= 1) go(); else audio.addEventListener("loadedmetadata", go, { once: true });
    renderPlayer(); renderBar();
  }
  function setMode(m) {
    if (m === mode) return;
    const pc = piece(), was = !audio.paused, cur = sectionAt(pc, mode, fi, audio.currentTime || 0);
    let target = cur && startOf(pc, cur, m);
    if (!target) {
      // nearest earlier section that has a start on both tracks
      const here = audio.currentTime || 0;
      const cands = pc.sections.map(s => [startOf(pc, s, mode), startOf(pc, s, m)]).filter(([a, b]) => a && b && a.f === fi && a.t <= here + 0.05);
      const last = cands.sort((x, y) => x[0].t - y[0].t).pop();
      target = last ? last[1] : { f: m === "rec" ? 0 : Math.min(fi, Math.max(0, track(pc, m).length - 1)), t: 0 };
    }
    if (loop) { const ls = pc.sections.find(s => s === loop.sec); loop = ls && startOf(pc, ls, m) ? { sec: ls, ...sectionEnd(pc, m, ls) } : null; }
    audio.pause(); mode = m; audio.dataset.id = "";
    load(target.f, target.t, was);
  }
  function jump(s) {
    const st = startOf(piece(), s, mode); if (!st) return;
    if (loop) loop = { sec: s, ...sectionEnd(piece(), mode, s) };
    load(st.f, st.t, true);
  }
  audio.addEventListener("timeupdate", () => {
    if (loop && fi === loop.f && loop.b != null && audio.currentTime >= loop.b - 0.05) audio.currentTime = loop.a;
    tick();
  });
  audio.addEventListener("ended", () => {
    if (loop && fi === loop.f) { audio.currentTime = loop.a; audio.play().catch(() => {}); return; }
    const files = track(piece(), mode);
    if (fi < files.length - 1) load(fi + 1, 0, true);
  });
  ["play", "pause"].forEach(e => audio.addEventListener(e, () => { renderPlayButtons(); renderBar(); media(); }));
  // Update the ▶/❚❚ markers in the list without rebuilding it.
  function renderPlayButtons() { document.querySelectorAll(".pr").forEach(b => { const i = +b.dataset.piece, cur = i === pi, playing = cur && !audio.paused; b.querySelector(".n").textContent = playing ? "❚❚" : cur ? "▶" : i + 1; b.setAttribute("aria-label", (playing ? "Pause " : "Play ") + P.pieces[i].name); }); }
  audio.addEventListener("loadedmetadata", tick);
  audio.addEventListener("error", () => {
    if (!audio.dataset.id) return;
    err = KEY ? "This track didn't load. Check your internet connection and try again." : "This page isn't finished being set up yet (no Google key).";
    renderPlayer();
  });
  function tick() {
    if (!P || pi < 0) return;
    const pc = piece(), t = audio.currentTime || 0, s = sectionAt(pc, mode, fi, t);
    const c = $("#clk"); if (c) c.textContent = fmt(t);
    const d = $("#dur"); if (d) d.textContent = audio.duration ? "of " + fmt(audio.duration) : "";
    const n = $("#now"); if (n) n.textContent = s ? s.name : "";
    const r = $("#scrub"); if (r && audio.duration && document.activeElement !== r) { r.max = audio.duration; r.value = t; }
    document.querySelectorAll(".secr[data-row]").forEach(b => b.classList.toggle("on", !!s && pc.sections[+b.dataset.row] === s));
    const pb = $("#pitch"); if (pb) { const ps = s && s.pitch ? s : null; pb.hidden = !ps; if (ps) { pb.textContent = "♪ " + ps.pitch; pb.dataset.p = ps.pitch; } }
    const bs = $("#barsec"); if (bs) bs.textContent = s ? " · " + s.name : "";
    const tc = $("#tcur"); if (tc) tc.textContent = fmt(t);
    const td = $("#tdur"); if (td) td.textContent = audio.duration ? fmt(audio.duration) : "–:––";
    const pf = $("#progfill"); if (pf) {
      const files = track(pc, mode), before = files.slice(0, fi).reduce((n, f) => n + (f.dur || 0), 0), all = files.reduce((n, f) => n + (f.dur || 0), 0);
      pf.style.width = (all ? Math.min(100, (before + t) / all * 100) : (audio.duration ? t / audio.duration * 100 : 0)) + "%";
    }
    const ms = $("#mscrub"); if (ms && audio.duration && document.activeElement !== ms) { ms.max = audio.duration; ms.value = t; }
  }
  function modeLabel() { const m = modes(piece()).find(x => x.m === mode); return m ? m.label : ""; }
  function media() {
    try {
      const ms = navigator.mediaSession; if (!ms || !piece() || typeof MediaMetadata === "undefined") return;
      ms.metadata = new MediaMetadata({ title: piece().name, artist: modeLabel(), album: P.title });
      ms.setActionHandler("play", () => audio.play().catch(() => {}));
      ms.setActionHandler("pause", () => audio.pause());
      ms.setActionHandler("seekbackward", () => { audio.currentTime = Math.max(0, audio.currentTime - BACK); });
      ms.setActionHandler("seekforward", () => { audio.currentTime += 10; });
      ms.setActionHandler("previoustrack", () => prevPress());
      ms.setActionHandler("nexttrack", () => nextPress());
    } catch (e) {}
  }

  /* ----- starting note ----- */
  let actx = null;
  function playNote(n) {
    const m = String(n || "").trim().match(/^([A-Ga-g])\s*([#♯b♭]?)\s*(-?\d)?$/); if (!m) return;
    const acc = /[#♯]/.test(m[2]) ? 1 : /[b♭]/.test(m[2]) ? -1 : 0, oct = m[3] != null ? +m[3] : 4;
    const midi = (oct + 1) * 12 + { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 }[m[1].toLowerCase()] + acc, f = 440 * Math.pow(2, (midi - 69) / 12);
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume();
      const t0 = actx.currentTime + 0.01, g = actx.createGain();
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.4, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.2); g.connect(actx.destination);
      [[1, "triangle", 1], [2, "sine", 0.2]].forEach(([k, type, v]) => { const o = actx.createOscillator(), og = actx.createGain(); o.type = type; o.frequency.value = f * k; og.gain.value = v; o.connect(og); og.connect(g); o.start(t0); o.stop(t0 + 2.3); });
    } catch (e) {}
  }

  /* ----- save for offline ----- */

    pieces.sort((a, b) => { const i = order.indexOf(norm(a.name)), k = order.indexOf(norm(b.name)); return (i < 0 ? 999 : i) - (k < 0 ? 999 : k); });
    const partNames = parts.map(p => p.name).filter(n => !/balanced/i.test(n)).sort((a, b) => voiceRank(a) - voiceRank(b));
    return { org: meta.org || "", title: meta.title || season.name, sub: meta.sub || "", parts: partNames,
             pieces: pieces.filter(pc => pc.recording || Object.keys(pc.tracks).length), season: season.id };
  }
  function start(d) {
    P = d; document.title = P.title || "Choir Practice";
    if (part && !P.parts.includes(part)) part = null;
    mode = "rec";   // always open on the full choir
    // Start on the first piece, ready to play (nothing downloads until ▶).
    if (P.pieces.length) { pi = 0; fi = 0; mode = modeFor(P.pieces[0], "rec"); }
    render();
    refreshSaved();
  }
  (async () => {
    try {
      const d = await readSeason();
      store.set("ncc-program", JSON.stringify(d));
      start(d);
    } catch (e) {
      console.warn("Couldn't read the season from Drive:", e);
      // Drive unreachable: use the copy from the last visit, else the built-in program.
      const cached = store.get("ncc-program");
      if (cached) { try { start(JSON.parse(cached)); return; } catch (x) {} }
      fetch("program.json", { cache: "no-cache" }).then(r => r.json()).then(start)
        .catch(() => { $("#app").innerHTML = `<p class="msg">The program didn't load. Check your internet connection and reload the page.</p>`; });
    }
  })();
})();
</script>
