<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Choir Practice</title>
<meta name="description" content="Practice tracks for the Northland Community Choir.">
<meta name="theme-color" content="#1f5c45">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
:root{
  --bg:#f6f4ef; --surface:#ffffff; --ink:#1b1f1d; --muted:#555f5a; --line:#d8ddd9;
  --accent:#1f5c45; --accent-soft:#e2efe8; --rec:#6a3f8f; --rec-soft:#efe7f6; --on:#ffffff; --warn:#8a3b12;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-head:"Fraunces", Georgia, serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111513; --surface:#1a201d; --ink:#eef2ef; --muted:#a7b3ad; --line:#2d3732;
  --accent:#7fd3a8; --accent-soft:#1d3329; --rec:#c9a6ec; --rec-soft:#2b2236; --on:#111513; --warn:#f2a679 } }
:root[data-theme="dark"]{
  --bg:#111513; --surface:#1a201d; --ink:#eef2ef; --muted:#a7b3ad; --line:#2d3732;
  --accent:#7fd3a8; --accent-soft:#1d3329; --rec:#c9a6ec; --rec-soft:#2b2236; --on:#111513; --warn:#f2a679 }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.5 var(--f-body);
  padding:0 max(16px,env(safe-area-inset-right)) 64px max(16px,env(safe-area-inset-left))}
main{max-width:600px;margin:max(16px,env(safe-area-inset-top)) auto 0;display:flex;flex-direction:column;gap:18px}
h1{font:600 2rem/1.15 var(--f-head);margin:0;text-wrap:balance}
h2{font:600 1.5rem/1.2 var(--f-head);margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.muted{color:var(--muted)}
.eyebrow{font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.big{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px 18px;min-height:64px}
.big b{display:block;font-size:1.15rem}
.big span{color:var(--muted);font-size:.95rem}
.big[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .big{text-align:center;font-weight:700}
.link{background:none;border:0;padding:8px 0;color:var(--accent);text-decoration:underline;font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px}
.tabs{display:flex;gap:6px;background:var(--bg);border-radius:14px;padding:5px}
.tab{flex:1;border:0;background:transparent;border-radius:10px;padding:12px 8px;font-weight:700;color:var(--muted);min-height:52px}
.tab[aria-selected="true"]{background:var(--c);color:var(--on)}
.c-part{--c:var(--accent);--cs:var(--accent-soft)} .c-rec{--c:var(--rec);--cs:var(--rec-soft)}
.clock{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.clock .t{font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.clock .d{color:var(--muted);font-variant-numeric:tabular-nums}
.now{font-weight:700;color:var(--c)}
input[type=range]{width:100%;height:36px;accent-color:var(--c)}
.transport{display:flex;align-items:center;justify-content:center;gap:16px}
.round{width:60px;height:60px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700}
.play{width:88px;height:88px;border-radius:999px;border:0;background:var(--c);color:var(--on);font-size:2rem}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tool{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;font-weight:700;min-height:56px}
.tool[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--on)}
.secs{display:flex;flex-direction:column}
.sec{display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:14px 8px;min-height:56px;width:100%}
.sec:first-child{border-top:0}
.sec .tm{font-variant-numeric:tabular-nums;color:var(--c);font-weight:700;flex:none}
.sec.on{background:var(--cs);border-radius:12px;box-shadow:inset 5px 0 0 var(--c);font-weight:700}
.sec:disabled{color:var(--muted);cursor:default}
.sec:disabled .tm{color:var(--muted);font-weight:400;font-size:.9rem}
.msg{border-left:4px solid var(--warn);padding:8px 12px;background:var(--surface);border-radius:8px}
select{font:inherit;padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
/* Part choice + Full choir / My part */
.setup{display:flex;flex-direction:column;gap:10px}
.partsel{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 12px 10px 16px;font-weight:700}
.partsel select{font-weight:700;min-height:44px;max-width:60%}
.partsel.ask{border-color:var(--accent);background:var(--accent-soft)}
.setup .tabs{background:var(--surface);border:2px solid var(--line)}
.tab:disabled{opacity:.45;cursor:default}
/* Playlist */
.pl{list-style:none;margin:0;padding:0;background:var(--surface);border:2px solid var(--line);border-radius:18px;overflow:hidden}
.pl>li+li{border-top:1px solid var(--line)}
.pr{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:14px 16px;min-height:72px}
.pr .n{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;font-weight:700;color:var(--muted);border:2px solid var(--line);font-size:.95rem}
.pr .nm{min-width:0}
.pr .nm b{display:block;font-size:1.1rem}
.pr .nm span{display:block;color:var(--muted);font-size:.9rem}
.pr .du{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.95rem}
.pl li.cur{background:var(--cs)}
.pl li.cur .n{background:var(--c);border-color:var(--c);color:var(--on)}
.pl li.cur .nm b{color:var(--c)}
.open{padding:0 12px 14px;display:flex;flex-direction:column;gap:12px}
.open .secs{background:var(--surface);border-radius:14px;padding:4px}
.open .mv select{flex:1}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;min-height:44px}
.chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--on)}
a.tool{display:flex;align-items:center;justify-content:center;text-decoration:none;color:inherit}
#offline h2{font-size:1.15rem}
/* Pinned player: stays at the top while scrolling */
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:2px solid var(--line);
  margin:0 calc(-1 * max(16px,env(safe-area-inset-right))) 0 calc(-1 * max(16px,env(safe-area-inset-left)));
  padding:max(8px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 6px max(16px,env(safe-area-inset-left))}
.bar .in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:8px}
.bar .what{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0 4px}
.bar .what b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .what>span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.bar .secline{max-width:600px;margin:6px auto 0;font-weight:700;color:var(--c);font-size:.95rem;line-height:1.3;min-height:1.3em}
.bar .play{width:52px;height:52px;font-size:1.2rem;flex:none}
.bar .sk{width:44px;height:44px;border-radius:999px;border:2px solid var(--line);background:var(--surface);flex:none;font-size:1rem}
.bar .sw{flex:none;max-width:34%;min-height:44px;border-radius:999px;border:2px solid var(--o);background:var(--os);color:var(--o);font-weight:700;font-size:.85rem;padding:0 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .seek{max-width:600px;margin:2px auto 0}
.bar .seek input{display:block;height:28px}
.c-part{--o:var(--rec);--os:var(--rec-soft)} .c-rec{--o:var(--accent);--os:var(--accent-soft)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar c-part" id="bar" role="region" aria-label="Now playing" hidden></div>
<main id="app"><p>Loading…</p></main>
<script src="config.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  const KEY = window.CHOIR_KEY || "";
  const API = window.CHOIR_API || "https://www.googleapis.com/drive/v3/files/";
  const src = id => `${API}${encodeURIComponent(id)}?alt=media&key=${encodeURIComponent(KEY)}`;
  const AUDIO = "ncc-audio-v1", audioKey = id => "https://ncc-audio.local/" + id;
  const canSave = "serviceWorker" in navigator && "caches" in window;
  let saved = new Set(), saving = null, saveMsg = "";

  let P = null, part = store.get("ncc-part") || null, pi = -1, mode = "part", fi = 0, loop = null, speed = 1, err = "";
  const audio = new Audio(); audio.preload = "metadata";

  function fmt(t) { if (t == null || !isFinite(t)) return "–:––"; t = Math.max(0, t); const m = Math.floor(t / 60), s = Math.floor(t % 60); return m + ":" + (s < 10 ? "0" : "") + s; }
  const piece = () => P.pieces[pi];

  /* ----- tracks: a list of files (one, or one per movement) ----- */
  // A second line for the same part in a piece (e.g. Tenor 1 and Tenor 2 both in the Tenor folder).
  const altOf = pc => (pc.alt && part && pc.alt[part] && pc.alt[part][0]) || null;
  const mainVoice = pc => (pc.mainVoice && pc.mainVoice[part]) || part;
  function partTrackName(pc) { return pc.tracks[part] ? part : (pc.tracks["Balanced Voices"] ? "Balanced Voices" : Object.keys(pc.tracks)[0]); }
  function track(pc, m) {
    if (m === "rec") return pc.recording ? [{ id: pc.recording.id, mvt: 0, offset: 0 }] : [];
    if (m === "part2") { const a = altOf(pc); return a ? a.files : []; }
    return pc.tracks[partTrackName(pc)] || [];
  }
  function modes(pc) {
    const a = altOf(pc);
    const out = [{ m: "part", label: part && pc.tracks[part] ? (a ? mainVoice(pc) : part) : "Practice track" }];
    if (a) out.push({ m: "part2", label: a.label });
    if (pc.recording) out.unshift({ m: "rec", label: "Full choir" });
    return out;
  }
  // Where section `s` starts on track mode `m`: {f: file index, t: seconds} or null.
  function startOf(pc, s, m) {
    if (m === "rec") return s.rec != null ? { f: 0, t: s.rec } : null;
    if (s.part == null) return null;
    const files = track(pc, m), f = files.findIndex(x => x.mvt === (s.mvt || 0));
    if (f < 0) return null;
    return { f, t: Math.max(0, s.part + (files[f].offset || 0)) };
  }
  function sectionAt(pc, m, f, t) {
    let best = null, bt = -1;
    pc.sections.forEach(s => { const st = startOf(pc, s, m); if (st && st.f === f && st.t <= t + 0.05 && st.t >= bt) { best = s; bt = st.t; } });
    return best;
  }
  function sectionEnd(pc, m, s) {
    const a = startOf(pc, s, m); let end = null;
    pc.sections.forEach(x => { const st = startOf(pc, x, m); if (x !== s && st && st.f === a.f && st.t > a.t + 0.05 && (end == null || st.t < end)) end = st.t; });
    return { f: a.f, a: a.t, b: end };
  }

  /* ----- playback ----- */
  function load(f, at, play) {
    const files = track(piece(), mode); if (!files[f]) return;
    const id = files[f].id;
    fi = f; err = "";
    if (audio.dataset.id !== id) { audio.dataset.id = id; audio.src = src(id); }
    audio.playbackRate = speed;
    const go = () => { if (at != null) audio.currentTime = at; if (play) audio.play().catch(() => {}); };
    if (audio.readyState >= 1) go(); else audio.addEventListener("loadedmetadata", go, { once: true });
    renderPlayer(); renderBar();
  }
  function setMode(m) {
    if (m === mode) return;
    const pc = piece(), was = !audio.paused, cur = sectionAt(pc, mode, fi, audio.currentTime || 0);
    let target = cur && startOf(pc, cur, m);
    if (!target) {
      // nearest earlier section that has a start on both tracks
      const here = audio.currentTime || 0;
      const cands = pc.sections.map(s => [startOf(pc, s, mode), startOf(pc, s, m)]).filter(([a, b]) => a && b && a.f === fi && a.t <= here + 0.05);
      const last = cands.sort((x, y) => x[0].t - y[0].t).pop();
      target = last ? last[1] : { f: m === "rec" ? 0 : Math.min(fi, Math.max(0, track(pc, m).length - 1)), t: 0 };
    }
    if (loop) { const ls = pc.sections.find(s => s === loop.sec); loop = ls && startOf(pc, ls, m) ? { sec: ls, ...sectionEnd(pc, m, ls) } : null; }
    audio.pause(); mode = m; audio.dataset.id = "";
    load(target.f, target.t, was);
  }
  function jump(s) {
    const st = startOf(piece(), s, mode); if (!st) return;
    if (loop) loop = { sec: s, ...sectionEnd(piece(), mode, s) };
    load(st.f, st.t, true);
  }
  audio.addEventListener("timeupdate", () => {
    if (loop && fi === loop.f && loop.b != null && audio.currentTime >= loop.b - 0.05) audio.currentTime = loop.a;
    tick();
  });
  audio.addEventListener("ended", () => {
    if (loop && fi === loop.f) { audio.currentTime = loop.a; audio.play().catch(() => {}); return; }
    const files = track(piece(), mode);
    if (fi < files.length - 1) load(fi + 1, 0, true);
  });
  ["play", "pause"].forEach(e => audio.addEventListener(e, () => { renderPlayButtons(); renderBar(); media(); }));
  // Update the ▶/❚❚ markers in the list without rebuilding it.
  function renderPlayButtons() { document.querySelectorAll(".pr").forEach(b => { const i = +b.dataset.piece, cur = i === pi, playing = cur && !audio.paused; b.querySelector(".n").textContent = playing ? "❚❚" : cur ? "▶" : i + 1; b.setAttribute("aria-label", (playing ? "Pause " : "Play ") + P.pieces[i].name); }); }
  audio.addEventListener("loadedmetadata", tick);
  audio.addEventListener("error", () => {
    if (!audio.dataset.id) return;
    err = KEY ? "This track didn't load. Check your internet connection and try again." : "This page isn't finished being set up yet (no Google key).";
    renderPlayer();
  });
  function tick() {
    if (!P || pi < 0) return;
    const pc = piece(), t = audio.currentTime || 0, s = sectionAt(pc, mode, fi, t);
    const c = $("#clk"); if (c) c.textContent = fmt(t);
    const d = $("#dur"); if (d) d.textContent = audio.duration ? "of " + fmt(audio.duration) : "";
    const n = $("#now"); if (n) n.textContent = s ? s.name : "";
    const r = $("#scrub"); if (r && audio.duration && document.activeElement !== r) { r.max = audio.duration; r.value = t; }
    document.querySelectorAll(".sec[data-i]").forEach(b => b.classList.toggle("on", !!s && pc.sections[+b.dataset.i] === s));
    const pb = $("#pitch"); if (pb) { const ps = s && s.pitch ? s : null; pb.hidden = !ps; if (ps) { pb.textContent = "♪ " + ps.pitch; pb.dataset.p = ps.pitch; } }
    const bs = $("#barsec"); if (bs) bs.textContent = s ? s.name : "";
    const bc = $("#barclk"); if (bc) bc.textContent = fmt(t);
    const ms = $("#mscrub"); if (ms && audio.duration && document.activeElement !== ms) { ms.max = audio.duration; ms.value = t; }
  }
  function modeLabel() { const m = modes(piece()).find(x => x.m === mode); return m ? m.label : ""; }
  function media() {
    try {
      const ms = navigator.mediaSession; if (!ms || !piece() || typeof MediaMetadata === "undefined") return;
      ms.metadata = new MediaMetadata({ title: piece().name, artist: modeLabel(), album: P.title });
      ms.setActionHandler("play", () => audio.play().catch(() => {}));
      ms.setActionHandler("pause", () => audio.pause());
      ms.setActionHandler("seekbackward", () => { audio.currentTime = Math.max(0, audio.currentTime - 10); });
      ms.setActionHandler("seekforward", () => { audio.currentTime += 10; });
      ms.setActionHandler("previoustrack", () => prevPress());
      ms.setActionHandler("nexttrack", () => nextPress());
    } catch (e) {}
  }

  /* ----- starting note ----- */
  let actx = null;
  function playNote(n) {
    const m = String(n || "").trim().match(/^([A-Ga-g])\s*([#♯b♭]?)\s*(-?\d)?$/); if (!m) return;
    const acc = /[#♯]/.test(m[2]) ? 1 : /[b♭]/.test(m[2]) ? -1 : 0, oct = m[3] != null ? +m[3] : 4;
    const midi = (oct + 1) * 12 + { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 }[m[1].toLowerCase()] + acc, f = 440 * Math.pow(2, (midi - 69) / 12);
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume();
      const t0 = actx.currentTime + 0.01, g = actx.createGain();
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.4, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.2); g.connect(actx.destination);
      [[1, "triangle", 1], [2, "sine", 0.2]].forEach(([k, type, v]) => { const o = actx.createOscillator(), og = actx.createGain(); o.type = type; o.frequency.value = f * k; og.gain.value = v; o.connect(og); og.connect(g); o.start(t0); o.stop(t0 + 2.3); });
    } catch (e) {}
  }

  /* ----- save for offline ----- */
  // The singer's part tracks (and Tenor 2 for tenors) plus every full choir recording.
  function wanted() {
    const out = [];
    P.pieces.forEach(pc => {
      if (part && pc.tracks[part]) pc.tracks[part].forEach(f => out.push(f));
      const a = altOf(pc); if (a) a.files.forEach(f => out.push(f));
      if (pc.recording) out.push(pc.recording);
    });
    const seen = new Set();
    return out.filter(f => !seen.has(f.id) && seen.add(f.id));
  }
  const mb = n => Math.max(1, Math.round(n / 1e6));
  async function refreshSaved() {
    if (!canSave) return;
    try { const keys = await (await caches.open(AUDIO)).keys(); saved = new Set(keys.map(k => k.url.split("/").pop())); } catch (e) { saved = new Set(); }
    renderOffline();
  }
  function renderOffline() {
    const el = $("#offline"); if (!el) return;
    const list = wanted(), missing = list.filter(f => !saved.has(f.id)), have = list.length - missing.length;
    const total = list.reduce((n, f) => n + (f.size || 0), 0), left = missing.reduce((n, f) => n + (f.size || 0), 0);
    const what = part ? `your ${esc(part)} tracks and the full choir recordings` : "the full choir recordings";
    let body;
    if (saving) {
      body = `<p><b>Saving ${saving.done + 1} of ${saving.total}…</b></p><p class="muted">Keep this page open until it finishes.</p>
        <progress max="${saving.total}" value="${saving.done}" style="width:100%;height:14px"></progress>`;
    } else if (!missing.length) {
      body = `<p><b>✓ Saved on this phone</b></p><p class="muted">Everything plays without internet now.</p>
        <button class="link" data-act="unsave">Remove saved tracks from this phone</button>`;
    } else {
      body = `<p>Save ${what} on this phone so they play without internet. About <b>${mb(have ? left : total)} MB</b>${have ? ` left (${have} of ${list.length} already saved)` : ""}. Best on Wi-Fi at home.</p>
        <button class="big" data-act="save" style="text-align:center"><b>${have ? "Finish saving" : "Save for offline"}</b></button>
        ${have ? `<button class="link" data-act="unsave">Remove saved tracks from this phone</button>` : ""}`;
    }
    el.innerHTML = `<h2>Practice without internet</h2>${body}${saveMsg ? `<p class="msg">${esc(saveMsg)}</p>` : ""}`;
  }
  async function saveAll() {
    if (saving) return;
    saveMsg = "";
    try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
    const missing = wanted().filter(f => !saved.has(f.id));
    saving = { done: 0, total: missing.length }; renderOffline();
    let c;
    try { c = await caches.open(AUDIO); } catch (e) { saving = null; saveMsg = "This phone's browser can't save tracks."; renderOffline(); return; }
    for (const f of missing) {
      try {
        const r = await fetch(src(f.id), { mode: "cors" });
        if (!r.ok) throw new Error("status " + r.status);
        await c.put(audioKey(f.id), new Response(await r.blob(), { headers: { "Content-Type": "audio/mpeg" } }));
        saved.add(f.id);
      } catch (e) {
        saveMsg = e && e.name === "QuotaExceededError"
          ? "This phone is out of space for saved tracks. Free up some storage and tap Finish saving."
          : "Saving stopped partway, probably a dropped connection. Tap Finish saving to continue where it left off.";
        break;
      }
      saving.done++; renderOffline();
    }
    saving = null; renderOffline();
  }
  async function unsaveAll() {
    try { await caches.delete(AUDIO); } catch (e) {}
    saved = new Set(); saveMsg = ""; renderOffline();
  }
  /* ----- the playlist: one screen ----- */
  const totalDur = (pc, m) => m === "rec" ? (pc.recording && pc.recording.dur) : track(pc, m).reduce((n, f) => n + (f.dur || 0), 0);
  function render() {
    const hasPart = !!part;
    $("#app").innerHTML = `<header><p class="eyebrow">${esc(P.org)}</p><h1>${esc(P.title)}</h1>${P.sub ? `<p class="muted">${esc(P.sub)}</p>` : ""}</header>
      <section class="setup" aria-label="What to play">
        <label class="partsel${hasPart ? "" : " ask"}"><span>${hasPart ? "Your part" : "Start here: choose your part"}</span>
          <select id="partSel">${hasPart ? "" : `<option value="" selected disabled>Choose…</option>`}${P.parts.map(x => `<option ${x === part ? "selected" : ""}>${esc(x)}</option>`).join("")}</select></label>
        <div class="tabs" role="tablist" aria-label="Play">
          <button class="tab c-rec" role="tab" data-mode="rec" aria-selected="${mode === "rec"}">Full choir</button>
          <button class="tab c-part" role="tab" data-mode="part" aria-selected="${mode !== "rec"}" ${hasPart ? "" : "disabled"}>${esc(hasPart ? part : "My part")}</button>
        </div>
      </section>
      <ol class="pl" id="pl" aria-label="Pieces"></ol>
      ${canSave ? `<section class="card" id="offline" aria-label="Save for offline"></section>` : ""}`;
    renderList(); renderOffline(); renderBar();
  }
  function renderList() {
    const el = $("#pl"); if (!el) return;
    el.className = "pl " + (mode === "rec" ? "c-rec" : "c-part");
    el.innerHTML = P.pieces.map((pc, i) => {
      const cur = i === pi, playing = cur && !audio.paused;
      const m = cur ? mode : (mode === "part2" ? "part" : mode);
      const d = totalDur(pc, m === "rec" && !pc.recording ? "part" : m);
      return `<li class="${cur ? "cur" : ""}">
        <button class="pr" data-piece="${i}" aria-current="${cur}" aria-label="${playing ? "Pause" : "Play"} ${esc(pc.name)}">
          <span class="n" aria-hidden="true">${playing ? "❚❚" : cur ? "▶" : i + 1}</span>
          <span class="nm"><b>${esc(pc.name)}</b><span>${esc(pc.composer || "")}</span></span>
          <span class="du">${d ? fmt(d) : ""}</span>
        </button>
        ${cur ? `<div class="open" id="open"></div>` : ""}</li>`;
    }).join("");
    renderPlayer();
  }
  // The open piece: its sections and practice tools.
  function renderPlayer() {
    const el = $("#open"); if (!el || pi < 0) return;
    const pc = piece(), files = track(pc, mode);
    const alt = altOf(pc), t2 = alt && mode !== "rec";
    el.innerHTML = `
      ${t2 ? `<div class="row"><button class="chip" data-mode="part" aria-pressed="${mode === "part"}">${esc(mainVoice(pc))}</button><button class="chip" data-mode="part2" aria-pressed="${mode === "part2"}">${esc(alt.label)}</button></div>` : ""}
      ${pc.movements && files.length > 1 ? `<label class="row mv">Movement <select id="mvt" aria-label="Movement">${files.map((f, i) => `<option value="${i}" ${i === fi ? "selected" : ""}>${esc(pc.movements[f.mvt] || "Movement " + (i + 1))}</option>`).join("")}</select></label>` : ""}
      <div class="secs" id="secs"></div>
      <div class="tools">
        <button class="tool" data-act="back" aria-label="Back 10 seconds">−10 s</button>
        <button class="tool" data-act="fwd" aria-label="Forward 10 seconds">+10 s</button>
        <button class="tool" data-act="loop" aria-pressed="${!!loop}">⟲ ${loop ? "Repeating" : "Repeat section"}</button>
        <button class="tool" id="pitch" data-act="pitch" hidden></button>
        <label class="tool row" style="justify-content:center;gap:6px">Speed <select id="speed" aria-label="Speed">${[0.75, 0.85, 1, 1.1].map(v => `<option value="${v}" ${v === speed ? "selected" : ""}>${v === 1 ? "Normal" : v + "×"}</option>`).join("")}</select></label>
        ${pc.score ? `<a class="tool" target="_blank" rel="noopener" href="https://drive.google.com/file/d/${esc(pc.score.id)}/view">Score ↗</a>` : ""}
      </div>
      ${err ? `<p class="msg">${esc(err)}</p>` : ""}`;
    renderSecs();
  }
  function renderSecs() {
    const el = $("#secs"); if (!el) return;
    const pc = piece();
    el.innerHTML = pc.sections.map((s, i) => { const st = startOf(pc, s, mode);
      return `<button class="sec" data-i="${i}" ${st ? "" : "disabled"}><span>${esc(s.name)}</span><span class="tm">${st ? fmt(st.t) : "not set yet"}</span></button>`; }).join("")
      || `<p class="muted">No sections yet.</p>`;
    tick();
  }
  // The other track the ⇄ button switches to.
  function otherMode() { const ms = modes(piece()); if (ms.length < 2) return null; return mode === "rec" ? (ms.find(x => x.m === "part") || ms[1]) : ms.find(x => x.m === "rec") || null; }
  function renderBar() {
    const b = $("#bar");
    if (!P) { b.hidden = true; return; }
    if (pi < 0) {
      // Nothing chosen yet: the bar still sits at the top; ▶ starts the first piece.
      b.hidden = false; b.className = "bar " + (mode === "rec" ? "c-rec" : "c-part");
      b.innerHTML = `<div class="in">
          <button class="sk" disabled aria-label="Previous">⏮</button>
          <button class="play" data-act="first" aria-label="Play ${esc(P.pieces[0] ? P.pieces[0].name : "")}">▶</button>
          <button class="sk" disabled aria-label="Next piece">⏭</button>
          <span class="what"><b>Pick a piece</b><span>${esc(mode === "rec" ? "Full choir" : (part || ""))}</span></span>
        </div>
        <p class="secline" id="barsec"></p>
        <div class="seek"><input type="range" id="mscrub" min="0" max="1" value="0" disabled aria-label="Position in the track"></div>`;
      return;
    }
    const o = otherMode();
    b.hidden = false; b.className = "bar " + (mode === "rec" ? "c-rec" : "c-part");
    b.innerHTML = `<div class="in">
        <button class="sk" data-act="prev" aria-label="Restart, or tap twice for the previous piece">⏮</button>
        <button class="play" data-act="play" aria-label="${audio.paused ? "Play" : "Pause"}">${audio.paused ? "▶" : "❚❚"}</button>
        <button class="sk" data-act="next" aria-label="Next piece" ${pi >= P.pieces.length - 1 ? "disabled" : ""}>⏭</button>
        <button class="what" data-act="goto" aria-label="Show ${esc(piece().name)}"><b>${esc(piece().name)}</b><span>${esc(modeLabel())} · <span id="barclk">${fmt(audio.currentTime)}</span></span></button>
        ${o ? `<button class="sw" data-mode="${o.m}" aria-label="Switch to ${esc(o.label)}">⇄ ${esc(o.label)}</button>` : ""}
      </div>
      <p class="secline" id="barsec"></p>
      <div class="seek"><input type="range" id="mscrub" min="0" max="${audio.duration || 1}" step="0.5" value="${audio.currentTime || 0}" aria-label="Position in the track"></div>`;
  }
  // Which kind of track to use for piece pc, given what the singer has chosen.
  function modeFor(pc, want) {
    const has = m => track(pc, m).length;
    if (want === "rec") return pc.recording ? "rec" : "part";
    if (want === "part2" && altOf(pc)) return "part2";
    return part && pc.tracks[part] ? "part" : (pc.recording ? "rec" : "part");
  }
  // Open piece n. Keeps listening to the same kind of track (your part or the full choir).
  function openPiece(n, play) {
    audio.pause(); audio.dataset.id = ""; pi = n; fi = 0; loop = null; err = "";
    mode = modeFor(P.pieces[n], mode);
    renderList();
    load(0, 0, play);
  }
  function chooseMode(m) {
    if (pi < 0) { mode = m; render(); return; }
    setMode(modeFor(piece(), m));
    $("#app .tabs") && document.querySelectorAll("#app .tabs .tab").forEach(t => t.setAttribute("aria-selected", String((t.dataset.mode === "rec") === (mode === "rec"))));
    renderList(); renderBar();
  }
  function choosePart(p) {
    part = p; store.set("ncc-part", part);
    if (pi >= 0) {
      const was = !audio.paused, s = sectionAt(piece(), mode, fi, audio.currentTime || 0);
      audio.pause(); audio.dataset.id = ""; loop = null;
      mode = modeFor(piece(), mode === "rec" ? "rec" : "part");
      render();
      const st = s && startOf(piece(), s, mode);
      load(st ? st.f : 0, st ? st.t : 0, was);
    } else render();
  }
  // ⏮: one tap restarts the track (or movement); a second tap within 1.5 s, or a tap in the first 3 s, goes to the previous piece.
  let lastPrev = 0;
  function prevPress() {
    const now = Date.now(), quick = now - lastPrev < 1500; lastPrev = now;
    if (!quick && (audio.currentTime || 0) > 3) { audio.currentTime = 0; tick(); return; }
    lastPrev = 0;
    if (pi > 0) openPiece(pi - 1, !audio.paused); else { audio.currentTime = 0; tick(); }
  }
  function nextPress() { if (pi < P.pieces.length - 1) openPiece(pi + 1, !audio.paused); }

  /* ----- events ----- */
  document.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.piece != null) {
      const n = +b.dataset.piece;
      if (n === pi) { if (!audio.dataset.id) load(fi, 0, true); else if (audio.paused) audio.play().catch(() => {}); else audio.pause(); }
      else openPiece(n, true);
      return;
    }
    if (b.dataset.mode) { chooseMode(b.dataset.mode); return; }
    if (b.dataset.i != null) { jump(piece().sections[+b.dataset.i]); return; }
    switch (b.dataset.act) {
      case "first": openPiece(0, true); break;
      case "prev": prevPress(); break;
      case "next": nextPress(); break;
      case "goto": { const o = $("#open"); if (o) o.closest("li").scrollIntoView({ behavior: "smooth", block: "start" }); break; }
      case "save": saveAll(); break;
      case "unsave": unsaveAll(); break;
      case "play": if (!audio.dataset.id) load(fi, 0, true); else if (audio.paused) audio.play().catch(() => {}); else audio.pause(); break;
      case "back": audio.currentTime = Math.max(0, audio.currentTime - 10); break;
      case "fwd": audio.currentTime = Math.min(audio.duration || 1e9, audio.currentTime + 10); break;
      case "pitch": playNote(b.dataset.p); break;
      case "loop": {
        if (loop) loop = null;
        else { const s = sectionAt(piece(), mode, fi, audio.currentTime || 0); if (s) loop = { sec: s, ...sectionEnd(piece(), mode, s) }; }
        renderPlayer(); break;
      }
    }
  });
  document.addEventListener("input", e => { if (e.target.id === "mscrub") { audio.currentTime = +e.target.value; tick(); } });
  document.addEventListener("change", e => {
    if (e.target.id === "partSel") { choosePart(e.target.value); return; }
    if (e.target.id === "speed") { speed = +e.target.value; audio.playbackRate = speed; }
    if (e.target.id === "mvt") { loop = null; load(+e.target.value, 0, !audio.paused); }
  });

  if (canSave) { try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {} }
  /* ----- read the season from Google Drive -----
     Choir Practice (shared folder) / <season> / Sheet Music, Recordings / Full Recordings, Practice Tracks / <part>
     plus <season>/choir-practice.json from Choir Admin (piece order, sections, movement names, offsets). */
  const FOLDER = "application/vnd.google-apps.folder";
  const LIST = API.replace(/\/$/, "");
  async function ls(folder) {
    const out = []; let tok = "";
    do {
      const q = encodeURIComponent(`'${folder}' in parents and trashed = false`);
      const f = encodeURIComponent("nextPageToken,files(id,name,mimeType,size,modifiedTime,createdTime)");
      const r = await fetch(`${LIST}?q=${q}&fields=${f}&pageSize=1000&key=${encodeURIComponent(KEY)}${tok ? "&pageToken=" + tok : ""}`);
      if (!r.ok) throw new Error("list " + r.status);
      const j = await r.json(); out.push(...j.files); tok = j.nextPageToken || "";
    } while (tok);
    return out;
  }
  const norm = s => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "");
  const isDir = f => f.mimeType === FOLDER;
  const named = (list, re) => list.find(f => isDir(f) && re.test(f.name.trim()));
  // "Footprints Mvt 3 Song - Practice Track - Alto.mp3" -> piece "Footprints", movement 2 (0-based), voice "Alto"
  function parseName(name) {
    const base = name.replace(/\.[a-z0-9]+$/i, ""), bits = base.split(" - ");
    let head = bits[0];
    const m = head.match(/^(.*?)\s+Mvt\.?\s*(\d+)\b/i);
    return { piece: m ? m[1] : head, mvt: m ? +m[2] - 1 : 0, voice: bits.length > 2 ? bits[bits.length - 1] : "" };
  }
  const VOICE_ORDER = ["soprano 1", "soprano 2", "soprano", "alto 1", "alto 2", "alto", "tenor 1", "tenor", "tenor 2", "baritone", "bass 1", "bass", "bass 2"];
  const voiceRank = v => { const i = VOICE_ORDER.indexOf(String(v).toLowerCase()); return i < 0 ? 99 : i; };
  async function readSeason() {
    if (!window.CHOIR_ROOT) throw new Error("reading seasons from Drive is switched off");
    const seasons = (await ls(window.CHOIR_ROOT)).filter(isDir);
    if (!seasons.length) throw new Error("no seasons");
    const found = await Promise.all(seasons.map(async s => { const kids = await ls(s.id); return { s, kids, j: kids.find(f => f.name === "choir-practice.json") }; }));
    found.sort((a, b) => ((b.j && b.j.modifiedTime) || "").localeCompare((a.j && a.j.modifiedTime) || "") || (b.s.createdTime || "").localeCompare(a.s.createdTime || ""));
    const { s, kids, j } = found[0];
    const meta = j ? await fetch(src(j.id)).then(r => r.json()) : { pieces: [] };
    const sheet = named(kids, /^sheet music$/i), recs = named(kids, /^recordings$/i);
    const recKids = recs ? await ls(recs.id) : [];
    const full = named(recKids, /^full recordings?$/i), prac = named(recKids, /^practice tracks?$/i);
    const [scores, fulls, partDirs] = await Promise.all([sheet ? ls(sheet.id) : [], full ? ls(full.id) : [], prac ? ls(prac.id) : []]);
    const parts = partDirs.filter(isDir);
    const partFiles = await Promise.all(parts.map(p => ls(p.id)));
    return buildProgram(meta, s, scores, fulls, parts, partFiles);
  }
  function buildProgram(meta, season, scores, fulls, parts, partFiles) {
    const offs = meta.offsets || {}, durs = meta.durations || {};
    const pieces = [], byKey = {};
    const get = name => { const k = norm(name); if (!byKey[k]) { byKey[k] = { name, composer: "", movements: null, sections: [], tracks: {}, alt: {}, mainVoice: {}, recording: null, score: null }; pieces.push(byKey[k]); } return byKey[k]; };
    (meta.pieces || []).forEach(m => Object.assign(get(m.name), { composer: m.composer || "", movements: m.movements || null, sections: m.sections || [] }));
    const file = f => ({ id: f.id, mvt: parseName(f.name).mvt, offset: offs[f.id] || 0, dur: durs[f.id], size: +f.size || 0 });
    fulls.filter(f => !isDir(f) && /\.(mp3|m4a|wav|aac|ogg)$/i.test(f.name)).forEach(f => { const pc = get(parseName(f.name).piece); if (!pc.recording) pc.recording = file(f); });
    scores.filter(f => /\.pdf$/i.test(f.name)).forEach(f => { const pc = get(parseName(f.name).piece); if (!pc.score) pc.score = { id: f.id }; });
    parts.forEach((dir, k) => {
      const groups = {};
      partFiles[k].filter(f => !isDir(f) && /\.(mp3|m4a|wav|aac|ogg)$/i.test(f.name)).forEach(f => {
        const n = parseName(f.name), pc = get(n.piece);
        ((groups[norm(pc.name)] = groups[norm(pc.name)] || { pc, voices: {} }).voices[n.voice] = groups[norm(pc.name)].voices[n.voice] || []).push(file(f));
      });
      Object.values(groups).forEach(({ pc, voices }) => {
        // The part's own line first (same name as the folder, else the "1" line, else the first);
        // any other line in the folder (Tenor 2 beside Tenor 1) becomes a second choice.
        const names = Object.keys(voices).sort((a, b) => voiceRank(a) - voiceRank(b));
        const main = names.find(v => norm(v) === norm(dir.name)) || names.find(v => /\b1$/.test(v)) || names[0];
        const sortF = l => l.sort((a, b) => a.mvt - b.mvt);
        pc.tracks[dir.name] = sortF(voices[main]);
        const rest = names.filter(v => v !== main);
        if (rest.length) { pc.mainVoice[dir.name] = main; pc.alt[dir.name] = rest.map(v => ({ label: v, files: sortF(voices[v]) })); }
      });
    });
    const order = meta.pieces ? meta.pieces.map(m => norm(m.name)) : [];
    pieces.sort((a, b) => { const i = order.indexOf(norm(a.name)), k = order.indexOf(norm(b.name)); return (i < 0 ? 999 : i) - (k < 0 ? 999 : k); });
    const partNames = parts.map(p => p.name).filter(n => !/balanced/i.test(n)).sort((a, b) => voiceRank(a) - voiceRank(b));
    return { org: meta.org || "", title: meta.title || season.name, sub: meta.sub || "", parts: partNames,
             pieces: pieces.filter(pc => pc.recording || Object.keys(pc.tracks).length), season: season.id };
  }
  function start(d) {
    P = d; document.title = P.title || "Choir Practice";
    if (part && !P.parts.includes(part)) part = null;
    mode = "rec";   // always open on the full choir
    render();
    refreshSaved();
  }
  (async () => {
    try {
      const d = await readSeason();
      store.set("ncc-program", JSON.stringify(d));
      start(d);
    } catch (e) {
      console.warn("Couldn't read the season from Drive:", e);
      // Drive unreachable: use the copy from the last visit, else the built-in program.
      const cached = store.get("ncc-program");
      if (cached) { try { start(JSON.parse(cached)); return; } catch (x) {} }
      fetch("program.json", { cache: "no-cache" }).then(r => r.json()).then(start)
        .catch(() => { $("#app").innerHTML = `<p class="msg">The program didn't load. Check your internet connection and reload the page.</p>`; });
    }
  })();
})();
</script>
</body>
</html>
